<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estimate working-age Council Tax Reduction in Newham for 2026–27 using the published rates and an applicable amount you supply." />
    <script>
      (() => {
        const root = document.documentElement
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        let saved
        try {
          saved = window.localStorage.getItem('newham-ctr-theme')
        } catch {
          // The device preference works even if browser storage is unavailable.
        }
        root.dataset.theme = saved === 'light' || saved === 'dark' ? saved : preferred
      })()
    </script>
    <title>Newham Council Tax Reduction Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
